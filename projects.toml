# Featured projects: shown large at the top and skipped in the sections below.
[[featured]]
repo = "music-store-sales-agent"
facts = [
  "Read-only SQL + RAG, tools picked by the model",
  "Hand-written tool-calling loop, no agent framework",
  "Every answer is backed by the SQL and sources it used",
]
snippet_question = "Which five countries generated the highest total revenue?"
snippet_tools = "get_schema → run_sql"
snippet_sql = """SELECT Customer.Country, ROUND(SUM(Invoice.Total), 2) AS TotalRevenue
FROM Invoice
JOIN Customer ON Invoice.CustomerId = Customer.CustomerId
GROUP BY Customer.Country
ORDER BY TotalRevenue DESC
LIMIT 5;"""
snippet_answer = "1. USA: $523.06 · 2. Canada: $303.96 · 3. France: $195.10 · 4. Brazil: $190.10 · 5. Germany: $156.48"

